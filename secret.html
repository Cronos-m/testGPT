<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Root Secret Config</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCw7hcR85y43jGCvj4Em2Jngx0C40wwd3Q",
            authDomain: "testgpt-a801d.firebaseapp.com",
            databaseURL: "https://testgpt-a801d-default-rtdb.firebaseio.com",
            projectId: "testgpt-a801d",
            storageBucket: "testgpt-a801d.firebasestorage.app",
            messagingSenderId: "428100296357",
            appId: "1:428100296357:web:0ad953920bd92c971c374c",
            measurementId: "G-0BG9VTXQZ2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.firebaseDb = { db, ref, set };
    </script>
    <style>
        body { background-color: #000000; color: #ececec; font-family: system-ui, sans-serif; }
        .input-dark { background-color: #2f2f2f; border: 1px solid #424242; color: white; }
        .input-dark:focus { outline: none; border-color: #10a37f; }
    </style>
</head>
<body class="h-screen flex flex-col p-6">

    <header class="mb-6">
        <h1 class="text-2xl font-bold text-white">Panel Secreto Root</h1>
        <p class="text-gray-400 text-sm">Configura el truco. Los cambios se sincronizan al instante.</p>
    </header>

    <div class="flex-1 overflow-y-auto space-y-4 max-w-2xl mx-auto w-full">
        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Palabra clave (Trigger)</label>
            <input type="text" id="trigger" placeholder="Ej: 100 bebidas" class="input-dark w-full px-4 py-3 rounded-lg">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Item a forzar</label>
            <input type="text" id="forcedItem" placeholder="Ej: Vodka" class="input-dark w-full px-4 py-3 rounded-lg">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Posición forzada predeterminada</label>
            <input type="number" id="forcePosition" placeholder="Ej: 3" class="input-dark w-full px-4 py-3 rounded-lg">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Lista completa (uno por línea)</label>
            <textarea id="listData" rows="10" placeholder="1. Coca-Cola&#10;2. Pepsi&#10;3. Agua..." class="input-dark w-full px-4 py-3 rounded-lg resize-none font-mono text-sm"></textarea>
        </div>

        <button onclick="syncConfig()" class="w-full bg-[#10a37f] hover:bg-[#0d8c6d] text-white font-bold py-3 rounded-lg transition-colors mt-4">
            Sincronizar con la Nube
        </button>

        <div id="status-msg" class="text-center text-sm text-[#10a37f] hidden mt-2">Sincronizado correctamente</div>
    </div>

    <script>
        function syncConfig() {
            const trigger = document.getElementById('trigger').value.trim();
            const forcedItem = document.getElementById('forcedItem').value.trim();
            const forcePosition = document.getElementById('forcePosition').value.trim();
            const listData = document.getElementById('listData').value.trim();

            if (!trigger || !forcedItem || !forcePosition || !listData) {
                alert("Por favor completa todos los campos");
                return;
            }

            const listArray = listData.split('\n').map(l => l.trim()).filter(l => l);
            
            const configData = {
                trigger: trigger,
                forcedItem: forcedItem,
                forcePosition: parseInt(forcePosition, 10),
                list: listArray,
                updatedAt: Date.now()
            };

            const { db, ref, set } = window.firebaseDb;
            set(ref(db, 'config/active'), configData).then(() => {
                const msg = document.getElementById('status-msg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 2000);
            }).catch(err => {
                alert("Error al sincronizar: " + err.message);
            });
        }
    </script>
</body>
</html>
