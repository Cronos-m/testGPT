    <!-- Panel Invisible -->
    <div id="invisible-panel" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-20">
        <div class="max-w-sm mx-auto w-full px-4">
            <div class="grid grid-cols-3 gap-3 p-6 bg-black bg-opacity-90 rounded-2xl border border-gray-800">
                <button class="invisible-key h-14 w-14" data-key="1">1</button>
                <button class="invisible-key h-14 w-14" data-key="2">2</button>
                <button class="invisible-key h-14 w-14" data-key="3">3</button>
                <button class="invisible-key h-14 w-14" data-key="4">4</button>
                <button class="invisible-key h-14 w-14" data-key="5">5</button>
                <button class="invisible-key h-14 w-14" data-key="6">6</button>
                <button class="invisible-key h-14 w-14" data-key="7">7</button>
                <button class="invisible-key h-14 w-14" data-key="8">8</button>
                <button class="invisible-key h-14 w-14" data-key="9">9</button>
                <button class="invisible-key h-14 w-14" data-key="C" style="color: rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.5);">C</button>
                <button class="invisible-key h-14 w-14" data-key="0">0</button>
                <button class="confirm-btn h-14 w-14" data-key="confirm">✓</button>
            </div>
            <p id="panel-display" class="text-center text-gray-400 text-sm mt-4 font-mono">Posición: -</p>
        </div>
    </div>

    <script>
        let currentConfig = null;
        let tempForcePosition = '';
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const messagesArea = document.getElementById('messages-area');
        const welcomeScreen = document.getElementById('welcome-screen');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Escuchar cambios en la nube y actualizar el footer
        window.addEventListener('load', () => {
            const { db, ref, onValue } = window.firebaseDb;
            onValue(ref(db, 'config/active'), (snapshot) => {
                currentConfig = snapshot.val();
                updateFooter();
            });
        });

        function updateFooter() {
            const footer = document.getElementById('footer-text');
            const pos = (currentConfig && currentConfig.forcePosition) ? currentConfig.forcePosition : '-';
            footer.innerHTML = `ChatGPT es IA. Al usarlo, aceptas los <a href="#" class="underline hover:text-white">Términos</a> y la <a href="#" class="underline hover:text-white">Política de privacidad</a>. vs.${pos}`;
        }

        function openInvisiblePanel() {
            if (userInput.value.trim() !== '') return;
            document.getElementById('invisible-panel').classList.remove('hidden');
            tempForcePosition = '';
            updatePanelDisplay();
        }

        document.addEventListener('click', function(e) {
            const key = e.target.closest('[data-key]');
            if (!key) return;
            
            const keyValue = key.getAttribute('data-key');
            
            if (keyValue === 'C') {
                tempForcePosition = '';
            } else if (keyValue === 'confirm') {
                if (tempForcePosition) {
                    const { db, ref, update } = window.firebaseDb;
                    update(ref(db, 'config/active'), { forcePosition: parseInt(tempForcePosition, 10) })
                        .then(() => {
                            document.getElementById('invisible-panel').classList.add('hidden');
                            console.log('Posición actualizada a:', tempForcePosition);
                            // El listener onValue se disparará automáticamente y actualizará el footer
                        })
                        .catch(err => {
                            console.error('Error al actualizar:', err);
                            alert('Error al guardar la posición');
                        });
                } else {
                    alert('Primero ingresa un número');
                }
            } else {
                if (tempForcePosition.length < 2) {
                    tempForcePosition += keyValue;
                }
            }
            updatePanelDisplay();
        });

        function updatePanelDisplay() {
            document.getElementById('panel-display').textContent = tempForcePosition ? `Posición: ${tempForcePosition}` : 'Posición: -';
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            welcomeScreen.classList.add('hidden');
            messagesArea.classList.remove('hidden');

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            if (currentConfig && text.toLowerCase().includes(currentConfig.trigger.toLowerCase())) {
                const processedList = processForcedList(currentConfig);
                // MENSAJE EXACTO SOLICITADO
                const responseText = `Aquí tienes una lista de ${text}:\n\n${processedList.join('\n')}`;
                await simulateAIResponse(responseText);
            } else {
                await simulateAIResponse("Esta es una respuesta simulada. Configura el trigger desde el panel secreto.");
            }
        }

        function processForcedList(config) {
            const pos = config.forcePosition || 1; // Fallback a 1 si no hay posición
            const newList = [...config.list];
            const forcedItemNormalized = config.forcedItem.toLowerCase().trim();
            let originalIndex = -1;
            
            for (let i = 0; i < newList.length; i++) {
                const itemContent = newList[i].replace(/^\d+\.\s*/, '').trim();
                if (itemContent.toLowerCase() === forcedItemNormalized) {
                    originalIndex = i;
                    break;
                }
            }
            
            if (originalIndex !== -1) newList.splice(originalIndex, 1);
            
            let adjustedPosition = pos - 1;
            if (originalIndex !== -1 && originalIndex < pos - 1) adjustedPosition = pos - 2;
            if (adjustedPosition < 0) adjustedPosition = 0;
            if (adjustedPosition > newList.length) adjustedPosition = newList.length;
            
            newList.splice(adjustedPosition, 0, `${pos}. ${config.forcedItem}`);
            
            return newList.map((item, index) => {
                const content = item.replace(/^\d+\.\s*/, '').trim();
                return `${index + 1}. ${content}`;
            });
        }

        function appendMessage(role, content) {
            const messageDiv = document.createElement('div');
            if (role === 'user') {
                messageDiv.className = `flex justify-end mb-6`;
                messageDiv.innerHTML = `<div class="bg-cgp-input rounded-2xl px-4 py-3 max-w-[80%] md:max-w-[70%]"><p class="text-cgp-text whitespace-pre-wrap break-words">${escapeHTML(content)}</p></div>`;
            } else {
                messageDiv.className = `flex justify-start mb-6`;
                messageDiv.innerHTML = `<div class="max-w-[80%] md:max-w-[85%]"><p class="text-cgp-text whitespace-pre-wrap break-words ai-response-text text-base leading-relaxed"></p></div>`;
            }
            messagesArea.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        async function simulateAIResponse(inputText) {
            const aiMessageDiv = appendMessage('ai', '');
            const textElement = aiMessageDiv.querySelector('.ai-response-text');
            textElement.innerHTML = `<div class="flex space-x-1 pt-2"><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div></div>`;
            await new Promise(resolve => setTimeout(resolve, 600));
            textElement.innerHTML = '';
            await typeWriter(textElement, inputText, 15);
        }

        async function typeWriter(element, text, speed) {
            const actualSpeed = text.includes('\n') ? 3 : speed;
            for (let i = 0; i < text.length; i++) {
                element.innerHTML += text.charAt(i);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(resolve => setTimeout(resolve, actualSpeed));
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>
