        .ghost-confirm:active {

    <script>
        // Script para forzar recarga sin caché
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        
        let currentConfig = null;
        let tempForcePosition = '';
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const messagesArea = document.getElementById('messages-area');
        const welcomeScreen = document.getElementById('welcome-screen');
        const sendBtn = document.getElementById('send-btn');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Trigger para Desktop (Doble clic) y Móvil (Mantener presionado 600ms)
        sendBtn.addEventListener('dblclick', (e) => { e.preventDefault(); openInvisiblePanel(); });
        
        let pressTimer;
        sendBtn.addEventListener('touchstart', (e) => { 
            pressTimer = setTimeout(() => { openInvisiblePanel(); }, 600); 
        }, {passive: true});
        sendBtn.addEventListener('touchend', () => clearTimeout(pressTimer));
        sendBtn.addEventListener('touchmove', () => clearTimeout(pressTimer));

        window.addEventListener('load', () => {
            const { db, ref, onValue } = window.firebaseDb;
            onValue(ref(db, 'config/lists'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const entries = Object.entries(data);
                    const lastEntry = entries[entries.length - 1];
                    currentConfig = { id: lastEntry[0], ...lastEntry[1] };
                } else {
                    currentConfig = null;
                }
                updateFooter();
            });
        });

        function updateFooter() {
            const footer = document.getElementById('footer-text');
            const pos = (currentConfig && currentConfig.forcePosition) ? currentConfig.forcePosition : '-';
            footer.innerHTML = `ChatGPT es IA. Al usarlo, aceptas los <a href="#" class="underline hover:text-white">Términos</a> y la <a href="#" class="underline hover:text-white">Política de privacidad</a>. vs.${pos}`;
        }

        function openInvisiblePanel() {
            if (userInput.value.trim() !== '') return;
            document.getElementById('invisible-panel').classList.remove('hidden');
            tempForcePosition = '';
        }

        document.addEventListener('click', function(e) {
            const key = e.target.closest('[data-key]');
            if (!key) return;
            const keyValue = key.getAttribute('data-key');
            
            if (keyValue === 'C') {
                tempForcePosition = '';
            } else if (keyValue === 'confirm') {
                if (tempForcePosition && currentConfig && currentConfig.id) {
                    const { db, ref, update } = window.firebaseDb;
                    update(ref(db, `config/lists/${currentConfig.id}`), { forcePosition: parseInt(tempForcePosition, 10) })
                        .then(() => {
                            document.getElementById('invisible-panel').classList.add('hidden');
                        })
                        .catch(err => console.error('Error:', err));
                } else {
                    document.getElementById('invisible-panel').classList.add('hidden');
                }
            } else {
                if (tempForcePosition.length < 2) tempForcePosition += keyValue;
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !currentConfig) return;

            welcomeScreen.classList.add('hidden');
            messagesArea.classList.remove('hidden');

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            if (text.toLowerCase().includes(currentConfig.trigger.toLowerCase())) {
                const triggerIndex = text.toLowerCase().indexOf(currentConfig.trigger.toLowerCase());
                let requestText = text.substring(triggerIndex + currentConfig.trigger.length).trim();
                if (!requestText) requestText = currentConfig.trigger;

                const processedList = processForcedList(currentConfig);
                const responseText = `Aquí tienes una lista de ${requestText}:\n\n${processedList.join('\n')}`;
                await simulateAIResponse(responseText);
            }
        }

        function ensure100Items(list) {
            let cleanList = list.map(item => item.replace(/^\d+\.\s*/, '').trim()).filter(item => item);
            while (cleanList.length < 100) {
                cleanList.push(`Opción ${cleanList.length + 1}`);
            }
            return cleanList.slice(0, 100);
        }

        function processForcedList(config) {
            const pos = config.forcePosition || 1;
            let newList = ensure100Items(config.list);
            const forcedItemNormalized = config.forcedItem.toLowerCase().trim();
            let originalIndex = -1;
            
            for (let i = 0; i < newList.length; i++) {
                if (newList[i].toLowerCase() === forcedItemNormalized) { originalIndex = i; break; }
            }
            
            if (originalIndex !== -1) newList.splice(originalIndex, 1);
            else newList.pop(); 
            
            let adjustedPosition = pos - 1;
            if (originalIndex !== -1 && originalIndex < pos - 1) adjustedPosition = pos - 2;
            if (adjustedPosition < 0) adjustedPosition = 0;
            if (adjustedPosition > newList.length) adjustedPosition = newList.length;
            
            newList.splice(adjustedPosition, 0, config.forcedItem);
            return newList.map((item, index) => `${index + 1}. ${item}`);
        }

        function appendMessage(role, content) {
            const messageDiv = document.createElement('div');
            if (role === 'user') {
                messageDiv.className = `flex justify-end mb-6`;
                messageDiv.innerHTML = `<div class="bg-cgp-input rounded-2xl px-4 py-3 max-w-[80%] md:max-w-[70%]"><p class="text-cgp-text whitespace-pre-wrap break-words">${escapeHTML(content)}</p></div>`;
            } else {
                messageDiv.className = `flex justify-start mb-6`;
                messageDiv.innerHTML = `<div class="max-w-[80%] md:max-w-[85%]"><p class="text-cgp-text whitespace-pre-wrap break-words ai-response-text text-base leading-relaxed"></p></div>`;
            }
            messagesArea.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        async function simulateAIResponse(inputText) {
            const aiMessageDiv = appendMessage('ai', '');
            const textElement = aiMessageDiv.querySelector('.ai-response-text');
            textElement.innerHTML = `<div class="flex space-x-1 pt-2"><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div></div>`;
            await new Promise(resolve => setTimeout(resolve, 100)); 
            textElement.innerHTML = '';
            await typeWriter(textElement, inputText, 2); 
        }

        async function typeWriter(element, text, speed) {
            const actualSpeed = text.includes('\n') ? 1 : speed;
            for (let i = 0; i < text.length; i++) {
                element.innerHTML += text.charAt(i);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(resolve => setTimeout(resolve, actualSpeed));
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>
